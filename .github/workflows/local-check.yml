name: Local availability check

# Runs on the home Proxmox runner so results reflect the home (NZ) network.
# `sync` fast-forwards this fork's `main` to upstream (pure mirror, never committed to; ruleset blocks
# force-push/delete). Pushes by the default token don't trigger upstream's workflows. If upstream changed
# its own .github/workflows the default token is refused: set secret SYNC_TOKEN (PAT, `workflow` scope).
# The check reads upstream directly, so it still runs when the sync fails.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-check
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main from upstream
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main --jq '.message'

  quiet:
    name: Keep upstream's workflows disabled in this fork
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state=="active") | select(.path|startswith(".github/workflows/")) | select(.path != ".github/workflows/local-check.yml") | .id' \
            | while read -r id; do gh workflow disable "$id" && echo "disabled $id"; done

  check:
    name: Check from home network
    needs: [sync, quiet]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, proxmox-nz]
    steps:
      - uses: actions/checkout@v6
        with:
          path: local
      - uses: actions/checkout@v6
        with:
          repository: laoma528/awesome-zhuiju-free
          ref: main
          path: src
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: reports
          path: reports

      - name: Run upstream checker unmodified
        working-directory: src
        env:
          CHECK_TIME_ZONE: Pacific/Auckland
        run: |
          cp reports/availability.json "$GITHUB_WORKSPACE/github-availability.json"
          node scripts/sync-readme.mjs
          node scripts/check-availability.mjs

      - name: Render report
        run: |
          node local/scripts/render-report.mjs \
            --local src/reports/availability.json \
            --github github-availability.json \
            --resources src/resources/resources.json \
            --readme src/README.md \
            --out-reports reports \
            --out-readme local/README.md \
            --repo "$GITHUB_REPOSITORY" \
            --upstream-sha "$(git -C src rev-parse --short HEAD)"

      - name: Publish `reports` branch
        working-directory: reports
        run: |
          git config user.name "home-runner[bot]"
          git config user.email "home-runner@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -qm "report: home network $(date -u +%F)"; git push; }

      - name: Publish README on `local` branch
        working-directory: local
        run: |
          git config user.name "home-runner[bot]"
          git config user.email "home-runner@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || { git commit -qm "readme: home network $(date -u +%F)"; git push; }
